<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 136" role="img" aria-label="Lambang Ravenhold">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset=".5" stop-color="#e8b558"/>
      <stop offset="1" stop-color="#9c6a2c"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a2f20"/>
      <stop offset="1" stop-color="#2a140d"/>
    </linearGradient>
    <linearGradient id="field-light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b4452f"/>
      <stop offset="1" stop-color="#4f2015"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset="1" stop-color="#e8b558"/>
    </linearGradient>
  </defs>
  <!-- Perisai: tepi gelap, bingkai emas, bidang merah karat warna jubah sang pemanah -->
  <path d="M64 3c15 10 34 14 56 14v52c0 31-23 51-56 64C31 120 8 100 8 69V17c22 0 41-4 56-14z" fill="#1d1410"/>
  <path d="M64 9c14 9 32 13 50 13v47c0 28-21 46-50 58C35 115 14 97 14 69V22c18 0 36-4 50-13z" fill="url(#rim)"/>
  <path d="M64 17c13 8 28 11 43 12v40c0 24-18 40-43 51V17z" fill="url(#field)"/>
  <path d="M64 17C51 25 36 28 21 29v40c0 24 18 40 43 51V17z" fill="url(#field-light)"/>
  <!-- Busur menghadap atas: tali lebih dulu supaya tertutup anak panah -->
  <path d="M30 88 64 106 98 88" fill="none" stroke="#f5e9cf" stroke-width="2.4" stroke-linejoin="round"/>
  <path d="M30 88C31 62 45 49 64 49s33 13 34 39" fill="none" stroke="#1d1410" stroke-width="10" stroke-linecap="round"/>
  <path d="M30 88C31 62 45 49 64 49s33 13 34 39" fill="none" stroke="url(#metal)" stroke-width="6" stroke-linecap="round"/>
  <!-- Anak panah membidik ke atas -->
  <path d="M64 25 77 50 67.5 47.5V101h-7V47.5L51 50z" fill="#1d1410" stroke="#1d1410" stroke-width="4" stroke-linejoin="round"/>
  <path d="M64 25 77 50 67.5 47.5V101h-7V47.5L51 50z" fill="url(#metal)"/>
  <path d="M60.5 92 50 104v10l10.5-9.5zM67.5 92 78 104v10l-10.5-9.5z" fill="#fff4d6" stroke="#1d1410" stroke-width="2" stroke-linejoin="round"/>
</svg>
